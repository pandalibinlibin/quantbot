# Index Configuration for QuantBot
# This file defines available indices and their properties
# VeighNa will also read this file to ensure consistency

# Currently active index for stock selection
# Options: csi300, csi500, dividend, csi1000, sp500, nasdaq100, etf_universe
active_index: etf_universe

# Index definitions
# Data sources: tushare (A-shares), eod (US stocks), file (local file)
indexes:
  # ========== A-Share Indices (via Tushare) ==========
  csi300:
    name: CSI 300
    name_en: CSI 300
    benchmark_code: 000300.SH
    etf_code: SH510300
    components_source: tushare
    # Tushare index code format: 000300.SH
    components_index_code: "000300.SH"

  csi500:
    name: CSI 500
    name_en: CSI 500
    benchmark_code: SH000905
    etf_code: SH510500
    components_source: tushare
    components_index_code: "000905.SH"

  dividend:
    name: SSE Dividend
    name_en: SSE Dividend
    benchmark_code: SH000015
    etf_code: SH510880
    components_source: tushare
    components_index_code: "000015.SH"

  csi1000:
    name: CSI 1000
    name_en: CSI 1000
    benchmark_code: SH000852
    etf_code: SH512100
    components_source: tushare
    components_index_code: "000852.SH"

  # ========== US Stock Indices (via EOD Historical Data) ==========
  sp500:
    name: S&P 500
    name_en: S&P 500
    benchmark_code: SPY
    etf_code: SPY
    components_source: eod
    components_index_code: "GSPC.INDX"

  nasdaq100:
    name: NASDAQ 100
    name_en: NASDAQ 100
    benchmark_code: QQQ
    etf_code: QQQ
    components_source: eod
    components_index_code: "NDX.INDX"

  # ========== ETF Universe (Top ETFs by Fund Size) ==========
  etf_universe:
    name: Top ETF Universe by Size
    name_en: Top ETF Universe by Size
    benchmark_code: 510300.SH # CSI300 ETF as benchmark
    etf_code: SH510300
    components_source: tushare_etf
    # ETF selection parameters (much simpler and faster)
    top_n_etfs: 150 # Select top N ETFs by fund size
    exclude_types: [] # Include all ETF types
    update_frequency: weekly # Update frequency: daily, weekly, monthly
