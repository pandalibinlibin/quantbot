# Backtest Configuration
# This configuration uses TopkDropoutStrategy with intelligent rebalancing
# to maintain consistency between routine execution and backtesting.

# Strategy configuration (uses TopK Dropout Strategy for ETF optimization)
strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy
  # Strategy parameters are loaded from system_config.yaml topk_dropout_strategy section
  # This ensures consistency with routine execution

# Backtest parameters
backtest:
  account: 1000000 # Initial account value (1 million for ETF Enhanced Indexing)
  benchmark: SH510300 # CSI300 ETF as benchmark

  # ETF trading costs
  exchange_kwargs:
    limit_threshold: 0.095 # Price limit threshold (9.5% for A-shares)
    deal_price: close # Use close price for trading
    open_cost: 0.0001 # ETF buy commission rate (0.01%)
    close_cost: 0.0001 # ETF sell commission rate (0.01%, no stamp duty)
    min_cost: 0 # No minimum commission for ETF
    trade_unit: 100 # Trading lot size (100 shares for A-shares, 1 for US)
