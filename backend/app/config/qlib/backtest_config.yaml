# Backtest Configuration
# This configuration uses the same Enhanced Indexing Strategy as the routine
# to maintain consistency between routine execution and backtesting.

# Strategy configuration (uses routine's Enhanced Indexing Strategy)
strategy:
  class: EnhancedIndexingStrategy
  module_path: app.services.enhanced_indexing_service
  # Strategy parameters are loaded from system_config.yaml enhanced_indexing section
  # This ensures consistency with routine execution

# Backtest parameters
backtest:
  account: 100000000 # Initial account value (100 million)
  benchmark: auto # Use auto-detection like routine (will resolve to SH000300 for CSI300)

  # A-share trading costs
  exchange_kwargs:
    limit_threshold: 0.095 # Price limit threshold
    deal_price: close # Use close price for trading
    open_cost: 0.0003 # Buy commission rate
    close_cost: 0.0013 # Sell commission rate (includes stamp duty)
    min_cost: 5 # Minimum commission per trade
