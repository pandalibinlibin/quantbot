# System Configuration for Qlib Data
# Changes to this file will trigger data cleanup and re-download on next routine call
#
# IMPORTANT: When you modify source, stock_pool, or region,
# the system will automatically:
# 1. Detect the configuration change
# 2. Clean up existing data
# 3. Re-download data based on new configuration

data:
  # Data frequency
  freq: "day"

  # Data source
  # Options: "tushare" (A-shares), "eod" (US stocks via EOD Historical Data)
  source: "tushare"

  # Stock pool (ETF universe defined in index_config.yaml)
  stock_pool: "etf_universe"

  # Market region
  # Options: "cn" (China A-shares) or "us" (US stocks)
  region: "cn"

  # Download range in days
  download_days:
    day: 1095 # 3 years for better model training data

# NOTE: Data path (QLIB_DATA_PATH, CSV_DATA_PATH) are
# configured via environment variables in .env file, not here.
# This ensures Docker volume mounts work correctly.

paths:
  # MLflow runs path (can be configured here)
  mlruns: "/app/mlruns"

# MongoDB configuration for Qlib Online Serving
mongodb:
  uri: "mongodb://mongodb:27017"
  database: "quantbot_qlib"

# Online Serving configuration
online_serving:
  experiment_name: "quantbot_online"
  rolling_step: 20 # Rolling step in trading days
  rolling_type: "expanding" # Options: "expanding" or "sliding"

# NOTE: Paper Trading configuration has been moved to paper_trading_config.yaml

# Scheduled Tasks Configuration
# The scheduler checks for config changes every 60 seconds
scheduler:
  # Routine task (data update + model training + signal generation)
  routine:
    enabled: false # Whether to enable scheduled routine
    time: "23:00" # Execution time (HH:MM format, 24-hour)

  # Execute trades task (paper trading execution)
  execute_trades:
    enabled: false # Whether to enable scheduled trading
    time: "09:35" # Execution time (HH:MM format, 24-hour)

  # Timezone for all scheduled tasks
  timezone: "Asia/Shanghai"

  # Config check interval in seconds
  config_check_interval: 60

# Data Quality Check Configuration
data_quality:
  # Threshold for detecting large step changes in price columns (OHLC)
  # A value of 0.5 means 50% change is considered abnormal
  large_step_threshold_price: 0.5

  # Threshold for detecting large step changes in volume column
  # A value of 3.0 means 300% change is considered abnormal
  large_step_threshold_volume: 3.0

  # Maximum allowed missing values per column
  # A value of 0 means no missing values are allowed
  missing_data_threshold: 0

# ETF Enhanced Indexing Strategy Configuration
# A capital-efficient strategy: 1 ETF + 9 alpha stocks = 10 positions
etf_enhanced_indexing:
  # Whether to enable ETF enhanced indexing strategy
  enabled: false

  # Dynamic weight mode
  # "dynamic": adjust ETF/Alpha weights based on score spread
  # "fixed": use fixed weights
  weight_mode: "dynamic"

  # Alpha weight range (for dynamic mode)
  # High score spread → High alpha weight (model confident)
  # Low score spread → Low alpha weight (model uncertain)
  alpha_weight_min: 0.2 # Minimum alpha weight (20%)
  alpha_weight_max: 0.5 # Maximum alpha weight (50%)

  # Stock selection
  max_stocks: 9 # Maximum alpha stocks (fixed at 9)
  weight_method: "score_weighted" # Weight allocation method

  # Rebalancing period in trading days (1 = daily, 5 = weekly)
  rebalance_period_days: 5

  # Output directory for target portfolio files
  output_dir: "/app/data/target_portfolio"

  # Email notification (uses existing email service)
  email_notification:
    enabled: true

# Built-in Factor Libraries Configuration
# These are Qlib's pre-defined factor sets that can be used alongside custom factors
builtin_factor_libraries:
  alpha158:
    # Whether to enable Alpha158 factor library
    # Alpha158 contains 158 classic technical factors optimized for tree-based models
    enabled: true

    # Description for display in frontend
    description: "158 classic technical factors for tree-based models (LightGBM, XGBoost)"

    # Data requirements - all fields must be available in the data source
    # VWAP is calculated from amount/volume in Tushare collector
    data_requirements:
      - "open"
      - "high"
      - "low"
      - "close"
      - "volume"
      - "vwap"

# Label Configuration
# Different markets require different label calculations due to trading rules
label_config:
  # China A-shares: T+1 trading rule
  # Today's signal (T close) → Buy T+1 open → Hold ~5 days → Exit T+6 close
  # Denominator: known 20d return vol with 0.15% floor (suppresses ultra-low-vol bond ETF inflation)
  # Cross-sectional normalization is applied by learn_processors (CSZScoreNorm)
  # Note: Qlib Max(x,N) is rolling-max; use Greater(a,b) for element-wise max with a constant
  cn:
    # Training target (vol-scaled for cross-asset learning)
    expression: "(Ref($close, -6) / Ref($open, -1) - 1) / Greater(Std($close / Ref($close, 1) - 1, 20), 0.0015)"
    description: "Executable 5d return from T+1 open to T+6 close, scaled by max(20d return vol, 0.15%)"
    # Evaluation target for IC / long-short / group returns (UNSCALED tradable PnL)
    # Must NOT use the training expression — vol-scaling inflates portfolio-style metrics
    evaluation_return: "Ref($close, -6) / Ref($open, -1) - 1"
    evaluation_horizon_days: 5

  # US stocks: T+0 trading rule
  # Today's signal → Buy tomorrow → Can sell tomorrow
  # Cross-sectional normalization is applied by learn_processors (CSZScoreNorm)
  us:
    expression: "Ref($close, -1) / $close - 1"
    description: "T+1 return for US stocks (T+0 trading rule)"
    evaluation_return: "Ref($close, -1) / $close - 1"
    evaluation_horizon_days: 1

# Execution alignment (portfolio generation + online TopK backtest)
# Defaults favor live realism over legacy "looks good in backtest" settings
execution:
  # Qlib exchange deal price: open ≈ T+1 morning entry; close = legacy EOD fill
  deal_price: open
  # MA5>MA20 filter silently rewrites model ranking toward already-rising names.
  # Default off so production portfolio follows model scores; set true to restore legacy filter.
  trend_filter_enabled: false
  trend_filter_ma_short: 5
  trend_filter_ma_long: 20

# TopK Dropout Strategy Configuration (ETF Optimized)
# Uses TopkDropoutStrategy with n_drop=topk for intelligent complete reselection capability
topk_dropout_strategy:
  # Whether to enable TopK Amount strategy
  enabled: true

  # Strategy parameters - ETF optimized
  # Rebalancing: daily (driven by Qlib TopkDropoutStrategy + backtest_daily)
  topk: 10 # Hold top 10 ETFs (configurable, default for ETF portfolio)
  n_drop: 10 # Maximum stocks to replace per rebalance (=topk for full flexibility)

  # Weight allocation method for ETF
  # "equal": Equal weight (1/topk each)
  # "score_weighted": Weight by prediction score (recommended for ETF)
  weight_method: "score_weighted"

  # Output directory for target portfolio files
  output_dir: "/app/data/target_portfolio"

  # Email notification
  email_notification:
    enabled: true
