# System Configuration for Qlib Data
# Changes to this file will trigger data cleanup and re-download on next routine call
#
# IMPORTANT: When you modify source, stock_pool, or region,
# the system will automatically:
# 1. Detect the configuration change
# 2. Clean up existing data
# 3. Re-download data based on new configuration
#
# NOTE: Only day-level data is supported in this stock selection system.
# Minute-level data should be handled by a separate timing/execution system.

data:
  # Data frequency (only "day" is supported)
  freq: "day"

  # Data source
  # Options: "tushare" (A-shares), "eod" (US stocks via EOD Historical Data)
  source: "tushare"

  # Stock pool
  # China (tushare): "csi300", "csi500", "csi800", "csi1000", "dividend", "all"
  # US (eod): "sp500", "nasdaq100", "djia"
  stock_pool: "csi300"

  # Market region
  # Options: "cn" (China A-shares) or "us" (US stocks)
  region: "cn"

  # Download range in days
  download_days:
    day: 1095 # 3 years for better model training data

# NOTE: Data path (QLIB_DATA_PATH, CSV_DATA_PATH) are
# configured via environment variables in .env file, not here.
# This ensures Docker volume mounts work correctly.

paths:
  # MLflow runs path (can be configured here)
  mlruns: "/app/mlruns"

# MongoDB configuration for Qlib Online Serving
mongodb:
  uri: "mongodb://mongodb:27017"
  database: "quantbot_qlib"

# Online Serving configuration
online_serving:
  experiment_name: "quantbot_online"
  rolling_step: 20 # Rolling step in trading days
  rolling_type: "expanding" # Options: "expanding" or "sliding"

# NOTE: Paper Trading configuration has been moved to paper_trading_config.yaml

# Scheduled Tasks Configuration
# The scheduler checks for config changes every 60 seconds
scheduler:
  # Routine task (data update + model training + signal generation)
  routine:
    enabled: false # Whether to enable scheduled routine
    time: "23:00" # Execution time (HH:MM format, 24-hour)

  # Execute trades task (paper trading execution)
  execute_trades:
    enabled: false # Whether to enable scheduled trading
    time: "09:35" # Execution time (HH:MM format, 24-hour)

  # Timezone for all scheduled tasks
  timezone: "Asia/Shanghai"

  # Config check interval in seconds
  config_check_interval: 60

# Data Quality Check Configuration
data_quality:
  # Threshold for detecting large step changes in price columns (OHLC)
  # A value of 0.5 means 50% change is considered abnormal
  large_step_threshold_price: 0.5

  # Threshold for detecting large step changes in volume column
  # A value of 3.0 means 300% change is considered abnormal
  large_step_threshold_volume: 3.0

  # Maximum allowed missing values per column
  # A value of 0 means no missing values are allowed
  missing_data_threshold: 0

# Enhanced Indexing Strategy Configuration
enhanced_indexing:
  # Whether to enable enhanced indexing strategy in routine
  enabled: true

  # Maximum deviation from benchmark weight per stock (default 2%)
  # e.g., if benchmark weight is 6%, target weight will be in [4%, 8%]
  max_deviation: 0.02

  # Minimum weight threshold (weights below this are set to 0)
  # Set to 0 to include all stocks in the portfolio
  min_weight: 0

  # Benchmark index selection
  # Options: "auto" (detect from data), "csi300", "csi500", "sp500", "nasdaq100"
  benchmark: "auto"

  # Output directory for target portfolio files
  output_dir: "/app/data/target_portfolio"
