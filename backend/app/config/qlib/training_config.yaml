# Training Workflow Configuration
# Time ranges and freq are automatically derived from actual data - no hardcoding needed.

# Model configuration
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.05
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 4
      num_boost_round: 100
      verbose: -1

  # Dataset configuration - time ranges and freq are set dynamically from actual data
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: CustomFactorHandler
        module_path: app.services.custom_factor_handler
        kwargs:
          instruments: all
          # freq is set dynamically based on available data
          enable_alpha158: false
      # segments are set dynamically based on actual data time range
      # Default split: 70% train, 15% valid, 15% test

  # Record templates
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: {}
    # PortAnaRecord temporarily disabled due to Qlib calendar boundary bug
    # TODO: Re-enable after fixing index out of bounds error
