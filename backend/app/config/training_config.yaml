# Training Workflow Configuration
# This file defines the default training configuration for QuantBot.
# The training workflow will read this file and execute accordingly.

# Experiment settings
experiment_name: "quantbot_training"

# Data frequency: "day" or "1min"
freq: "day"

# Market and benchmark settings
# Note: Use "all" to match instruments/all.txt file created by data collector
market: &market all
benchmark: &benchmark SH000300

# Data handler configuration for CustomFactorHandler
# CustomFactorHandler loads pre-computed factors from bin files
data_handler_config: &data_handler_config
  start_time: "2026-02-02"
  end_time: "2026-02-10"
  fit_start_time: "2026-02-02"
  fit_end_time: "2026-02-06"
  instruments: *market
  freq: "day"
  # CustomFactorHandler specific options:
  # enable_alpha158: false - use only pre-computed factors from bin files
  # enable_alpha158: true  - also include Alpha158 factors (computed on-the-fly)
  enable_alpha158: false

# Task configuration (following qrun format)
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.05
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 4
      num_boost_round: 100
      verbose: -1

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        # Use our CustomFactorHandler instead of Alpha158
        # CustomFactorHandler loads factors from database + optional Alpha158
        class: CustomFactorHandler
        module_path: app.services.custom_factor_handler
        kwargs: *data_handler_config
      segments:
        train: ["2026-02-02", "2026-02-05"]
        valid: ["2026-02-06", "2026-02-06"]
        test: ["2026-02-09", "2026-02-10"]

  # Record templates for generating predictions and analysis
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: {}
