# Data collector field configuration
# This file defines which fields each data source should collect
data_sources:
  yahoo_finance:
    description: "Yahoo Finance data source configuration with all available fields"
    field_descriptions:
      open: "Opening price of the trading session"
      high: "Highest price during the trading session"
      low: "Lowest price during the trading session"
      close: "Closing price of the trading session (adjusted for splits and dividends)"
      volume: "Number of shares traded during the session"
      vwap: "Volume Weighted Average Price (calculated field)"
    fields:
      - open
      - high
      - low
      - close # 这个已经是前复权价格
      - volume
      - vwap
    qlib_mapping:
      open: "open"
      high: "high"
      low: "low"
      close: "close" # 前复权价格
      volume: "volume"
      vwap: "vwap"
  # Future data sources can be added here
